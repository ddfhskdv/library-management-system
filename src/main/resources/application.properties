# Application Configuration
server.port=8081
spring.application.name=Library Management System

# H2 In-Memory Database Configuration (Default: runs with zero external setup)
spring.datasource.url=jdbc:h2:file:./data/librarydb;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Web Console (Accessible during development at http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
spring.profiles.default=dev

# Jackson: serialize LocalDate/LocalDateTime as ISO-8601 strings, not timestamp arrays
spring.jackson.serialization.write-dates-as-timestamps=false

library.security.admin.username=${LIBRARY_ADMIN_USERNAME:admin}
library.security.admin.password=${LIBRARY_ADMIN_PASSWORD:admin123}
library.security.librarian.username=${LIBRARY_LIBRARIAN_USERNAME:librarian}
library.security.librarian.password=${LIBRARY_LIBRARIAN_PASSWORD:library123}
library.demo-data.enabled=${LIBRARY_DEMO_DATA_ENABLED:true}
library.loan.default-days=${LIBRARY_LOAN_DEFAULT_DAYS:14}
library.loan.max-days=${LIBRARY_LOAN_MAX_DAYS:60}
library.loan.max-renewals=${LIBRARY_LOAN_MAX_RENEWALS:2}
library.fine.daily-rate=${LIBRARY_FINE_DAILY_RATE:5.0}
library.reminders.enabled=${LIBRARY_REMINDERS_ENABLED:false}
library.reminders.from=${LIBRARY_REMINDERS_FROM:no-reply@localhost}
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

